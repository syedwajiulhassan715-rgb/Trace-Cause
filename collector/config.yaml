receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # JSON, uncompressed: the analyzer parses OTLP JSON directly (no protobuf or gzip handling).
  otlp_http/analyzer:
    endpoint: http://analyzer:8000
    encoding: json
    compression: none
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger, otlp_http/analyzer]
